name: biometric_shield
description: >
  A composable Flutter SDK that wraps biometric authentication into an
  injectable, namespace-aware layer with typed results, fallback chains,
  and audit event emission.
version: 0.1.0
homepage: https://github.com/biometric-shield/biometric_shield

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
