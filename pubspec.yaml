name: biometric_shield
description: >-
  A composable Flutter SDK that wraps biometric authentication into an
  injectable, namespace-aware layer with typed results, fallback chains,
  session management, lockout logic, and audit event emission. Backend-agnostic —
  works with Firebase, Supabase, Amplify, custom JWT, or any auth system.
version: 0.1.0
homepage: https://github.com/biometric-shield/biometric_shield
repository: https://github.com/biometric-shield/biometric_shield
issue_tracker: https://github.com/biometric-shield/biometric_shield/issues

topics:
  - biometric
  - authentication
  - security
  - face-id
  - fingerprint

platforms:
  android:
  ios:

environment:
  sdk: ^3.10.8
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.7
  universal_io: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.5.0
  build_runner: ^2.10.5

flutter:
